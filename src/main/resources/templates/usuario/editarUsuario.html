<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{layout/plantilla :: head('Editar Usuario')}"></head>
<body class="bg-info-subtle d-flex flex-column min-vh-100">

<header th:replace="~{layout/plantilla :: navbar}"></header>


<main class="container flex-grow-1 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card mt-3">
                <div class="card-header text-center">
                    <h1>Editar Negocio</h1>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/usuario/guardar}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{idUsuario}">
                        <div class="mt-3">
                            <label for="username" class="form-label">Nombre de usuario:</label>
                            <input class="form-control" type="text" th:field="*{username}" id="username">
                        </div>

                        <div class="mt-3">
                            <label for="rol">Rol</label>
                            <select class="form-select" th:field="*{roles}" id="rol">
                                <option value="0" disabled selected>Seleccione un rol</option>
                                <option th:each="rol : ${roles}"
                                        th:value="${rol.idRol}"
                                        th:text="${rol.getRol()}"
                                ></option>
                            </select>
                        </div>
                        <p class="text-danger"
                           th:if="${#fields.hasErrors('roles')}"
                           th:errors="*{roles}"
                        >
                        </p>

                        <div class="mt-3 d-flex justify-content-start">
                            <button type="button" class="btn btn-warning text-start" data-bs-toggle="modal" data-bs-target="#modalCambiarPassword">Cambiar contraseña</button>
                        </div>
                        <div class="modal fade" id="modalCambiarPassword" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h3>Cambiar contraseña</h3>
                                        <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                                    </div>
                                    <div class="modal-body">
                                        <label class="form-label" for="password">Ingrese la nueva contraseña</label>
                                        <input class="form-control" type="password" th:field="*{password}" id="password">
                                    </div>
                                    <div class="modal-footer d-flex justify-content-center">
                                        <button type="button" class="btn btn-success" data-bs-dismiss="modal">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-3">
                            <a class="btn btn-secondary "
                               th:href="@{/admin/usuarios}">Volver</a>
                            <button type="submit" class="btn btn-success">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>



<footer th:replace="~{/layout/plantilla :: footer}"></footer>
</body>
</html>
