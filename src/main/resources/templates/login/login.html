<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{layout/plantilla :: head(#{login.iniciarSesion})}"></head>
<body class="d-flex flex-column min-vh-100 bg-info-subtle">
<header th:replace="~{/layout/plantilla :: navbar}"></header>

<th:block th:if="${success}">
    <div th:replace="~{layout/alertas :: exitoRegistro}"></div>
</th:block>

<th:block th:if="${usuarioEditado}">
    <div th:replace="~{layout/alertas :: usuarioEditado}"></div>
</th:block>

<main class="container flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5 ">

        <div class="card">
            <div class="card-header text-center">
                <h1 th:text="#{login.iniciarSesion}">Iniciar Sesión</h1>
            </div>
            <form th:action="@{/login}" method="post">

                <div class="card-body ">
                    <div th:if="${param.error}" class="mx-2 text-danger text-center" >
                        <h5 th:text="#{login.incorrecto}">El usuario o la contraseña son incorrectos</h5>
                    </div>
                    <div class="mt-3">
                        <input required class="form-control fs-5" type="text" name="username" id="username" th:placeholder="#{login.usuario}">
                    </div>
                    <div class="mt-3 ">

                        <input required class="form-control fs-5" type="password" name="password" id="password" th:placeholder="#{login.contraseña}">
                    </div>
                    <div class="mt-3 d-flex flex-column justify-content-center py-3 gap-3">
                        <button class="btn btn-success fs-5 w-100" type="submit" th:text="#{login.iniciarSesion}">Iniciar sesión</button>

                        <a class="btn btn-outline-warning fs-5 w-100" th:href="@{/register}" th:text="#{boton.register}">Registrarse</a>
                    </div>
                </div>


            </form>
        </div>
    </div>
</main>
<footer th:replace="~{/layout/plantilla :: footer}"></footer>
</body>
</html>
