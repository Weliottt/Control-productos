<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{layout/plantilla :: head(#{editarProducto})}"></head>
<body class="bg-info-subtle d-flex flex-column min-vh-100">

<header th:replace="~{layout/plantilla :: navbar}"></header>

<main class="container flex-grow-1 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card mt-3">
                <div class="card-header text-center">
                    <h1 th:text="#{editarProducto}">Editar Producto</h1>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/producto/guardar}" th:object="${producto}" method="post">
                        <input type="hidden" th:field="*{idProducto}">
                        <input type="hidden" name="idNegocio" th:value="${idNegocio}">

                        <div class="mt-3">
                            <label for="nombreProducto" class="form-label" th:text="#{label.nombreProducto}">Nombre Producto:</label>
                            <input class="form-control" type="text" th:field="*{nombreProducto}" id="nombreProducto">
                        </div>
                        <div class="d-flex gap-2 justify-content-between">

                            <div class="mt-3 w-50">
                                <label for="precio" class="form-label" th:text="#{label.precio}">Precio:</label>
                                <input class="form-control" type="number" th:field="*{precioProducto}" id="precio" min="0">
                            </div>
                            <div class="mt-3 w-50">
                                <label for="cantidad" class="form-label" th:text="#{label.cantidad}">Cantidad:</label>
                                <input class="form-control" type="number" th:field="*{cantidad}" id="cantidad" min="0">
                            </div>
                        </div>
                        <div class="mt-3">
                            <div class="d-flex justify-content-between gap-2">
                                <div class="mt-3 w-50">
                                    <label for="marca" th:text="#{label.nombreMarca}">Marca:</label>
                                    <select name="idMarca" id="marca" class="form-select">
                                        <option value="0"  disabled th:text="#{select.marca}">Seleccione una marca</option>
                                        <option th:each="marca : ${marcas}"
                                                th:value="${marca.idMarca}"
                                                th:text="${marca.nombreMarca}"
                                        ></option>
                                    </select>
                                    <a th:replace="~{marca/agregarMarca :: botonAgregarMarca}"></a>
                                    <div th:replace="~{marca/agregarMarca :: modalAgregarMarca}"></div>
                                </div>
                                <div class="mt-3 w-50">

                                    <label for="categoria" th:text="#{label.categoria}">Categoría:</label>
                                    <select class="form-select" name="idCategoria" id="categoria">
                                        <option value="0" disabled th:text="#{select.categoria}">Seleccione una categoría</option>
                                        <option th:each="categoria : ${categorias}"
                                                th:value="${categoria.idCategoria}"
                                                th:text="${categoria.nombreCategoria}"
                                        ></option>
                                    </select>
                                    <a th:replace="~{/categoria/agregarCategoria :: botonAgregarCategoria}"></a>
                                    <div th:replace="~{categoria/agregarCategoria :: modalCategoria}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label for="descripcion" th:text="#{label.descripcion}">Descripción:</label>
                            <textarea th:field="*{descripcion}" id="descripcion" cols="30" rows="5" class="form-control"></textarea>
                        </div>

                        <div class="mt-3 text-end">
                            <a class="btn btn-secondary mx-2" th:href="@{/user/negocio/{id}(id = ${idNegocio})}" th:text="#{boton.volver}">Volver</a>
                            <button type="submit" class="btn btn-success" th:text="#{boton.guardar}">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{/layout/plantilla :: footer}"></footer>
</body>
</html>
