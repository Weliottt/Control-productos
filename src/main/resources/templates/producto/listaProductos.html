<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      data-bs-theme="dark">

<head th:replace="~{/layout/plantilla :: head(#{producto.titulo})}"></head>

<body class="bg-info-subtle d-flex flex-column min-vh-100">

<header th:replace="~{/layout/plantilla :: navbar}"></header>

<nav sec:authorize="hasRole('ROLE_ADMIN')">
  <div class="container">
    <div class="row">
      <div class="mt-3 text-center">
        <a th:href="@{/admin/producto/agregar/{idNegocio}(idNegocio = ${idNegocio})}" class="btn btn-primary"><i
                class="fa-solid fa-plus"></i><span th:text="#{agregarProducto}"> Agregar Producto</span>
        </a>
      </div>
    </div>
  </div>
</nav>


<section th:if="${vacio}" class="container flex-grow-1 mt-4">
  <div th:replace="~{layout/cardVacia :: sinProductos}"></div>
</section>

<section th:if="${!vacio}" class="container flex-grow-1 mt-4" th:fragment="listaProductos">
  <div class="row align-items-center">
    <div class="col-12 mt-4">
      <div class="table-responsive">

        <table class="table table-striped table-dark align-middle text-center">
          <tr>
            <th>Id</th>
            <th th:text="#{table.producto}">Producto</th>
            <th th:text="#{label.marca}">Marca</th>
            <th class="d-none d-lg-table-cell" th:text="#{label.categoria}">Categoría</th>
            <th th:text="#{label.precio}">Precio</th>
            <th th:text="#{label.cantidad}">Cantidad</th>
            <th>Total</th>
            <th sec:authorize="hasRole('ROLE_ADMIN')" colspan="2" th:text="#{table.acciones}">Acciones</th>
          </tr>
          <tr th:each="producto : ${productos}">
            <td th:text="${producto.idProducto}">1</td>
            <td th:text="${producto.nombreProducto}">NombreProducto</td>
            <td th:text="${producto.marcaProducto.nombreMarca}"></td>
            <td class="d-none d-lg-table-cell" th:text="${producto.categoriaProducto.nombreCategoria}"></td>
            <td th:text="${#numbers.formatCurrency(producto.precioProducto)}">1500</td>
            <td th:text="${producto.cantidad}">800</td>
            <td th:text="${#numbers.formatCurrency(producto.total)}">1200000</td>

            <td sec:authorize="hasRole('ROLE_ADMIN')">
              <a class="btn btn-outline-light" th:href="@{/admin/producto/editar/{id}(id = ${producto.idProducto})}">
                <i class="fa-solid fa-pen-to-square"></i><span th:text="#{boton.editar}">Editar</span></a></td>

            <td sec:authorize="hasRole('ROLE_ADMIN')" >
              <a th:replace="~{producto/eliminarProducto :: botonEliminarProducto}"></a></td>
          </tr>

        </table>
      </div>

    </div>

    <div sec:authorize="hasRole('ROLE_ADMIN')" class="col-12 mt-3">
      <div class="card bg-success">
        <div class="card-body text-center align-items-center">
          <h2 th:text="#{productos.total}">Total en mercadería</h2>
          <p class="fs-3" th:text="${#numbers.formatCurrency(totalGeneral)}"></p>
        </div>
      </div>
    </div>

  </div>
</section>

<div th:replace="~{producto/eliminarProducto :: modalEliminarProducto}"></div>

<footer th:replace="~{/layout/plantilla :: footer}"></footer>
</body>
</html>
