<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
>
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Título</title>
    <!--            Bootstrap           -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/7.1.0/css/all.css}">
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand fs-2" th:href="@{/}"><i class="fa-solid fa-book"></i> <span
                th:text="#{header.titulo}"></span></a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"></button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav">
                <li class="nav-item fs-4"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li sec:authorize="hasRole('ROLE_ADMIN')" class="nav-item fs-4"><a class="nav-link" th:href="@{/admin/usuarios}">Usuarios</a></li>
            </ul>

            <!-- 👇 grupo alineado a la derecha -->
            <div class="d-flex align-items-center ms-auto gap-2">

                <!-- Dropdown idioma -->
                <div class="dropdown" data-bs-theme="dark">
                    <button class="btn btn-outline-light dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <i class="fa-solid fa-earth-america"></i>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="?lang=es">Español</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="?lang=en">English</a>
                        </li>
                    </ul>
                </div>

                <a sec:authorize="!isAuthenticated()" class="btn btn-outline-light" th:href="@{/login}">
                    <i class="fa-solid fa-user"></i><span class="mx-2">Iniciar sesión</span>
                </a>

                <div sec:authorize="isAuthenticated()">
<!--                    <button th:replace="~{login/logout :: botonCerrarSesion}"></button>-->
<!--                    <div th:replace="~{login/logout :: cerrarSesion}"></div>-->
                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle"
                                type="button"
                                data-bs-toggle="dropdown"
                        ><i class="fa-solid fa-user mx-2"></i><span sec:authentication="name"></span></button>

                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <button type="button" class="dropdown-item" data-bs-toggle="modal" data-bs-target="#modalCerrarSesion">Cerrar sesion</button>
                            </li>
                        </ul>

                    </div>
                    <div th:replace="~{login/logout :: #modalCerrarSesion}"></div>
                </div>

            </div>
        </div>
    </div>
</nav>


<footer th:fragment="footer" data-bs-theme="dark">
    <div class="bg-primary mt-md-5 text-center p-5">
        <a target="_blank" class="text-white fs-3 text-decoration-none" href="https://github.com/Weliottt"><i class="fa-brands fa-github"></i> <span>Weliottt</span></a>
    </div>
</footer>
